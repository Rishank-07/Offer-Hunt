[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offerhunt"
version = "0.1.0"
description = "OFFERHUNT: AI-powered offer discovery, extraction, and proof validation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2,<3",
    "google-genai",
    "tavily-python",
    "streamlit",
    "openpyxl",
    "python-dotenv",
    "pytest",
    "pydantic"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
